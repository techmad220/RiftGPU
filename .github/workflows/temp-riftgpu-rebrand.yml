name: Temporary RiftGPU Rebrand

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  rebrand:
    if: github.event.issue.title == 'run:riftgpu-rebrand-20260828'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Rename repository and update description
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue

          gh auth status
          $login = (gh api user --jq .login).Trim()
          if ($login -ne 'techmad220') {
            throw "TECH host gh CLI is authenticated as '$login', expected 'techmad220'."
          }

          $oldRepo = 'techmad220/vulkan-rocm-bridge'
          $newRepo = 'techmad220/RiftGPU'
          $description = 'Rust GPU interoperability layer connecting Vulkan and AMD ROCm/HIP through shared memory, pluggable compute backends, capability routing, and hardware-certified execution paths.'

          gh repo edit $oldRepo --description $description
          if ($LASTEXITCODE -ne 0) { throw 'Repository description update failed.' }

          gh repo rename RiftGPU --repo $oldRepo --yes
          if ($LASTEXITCODE -ne 0) { throw 'Repository rename failed.' }

          $actual = gh repo view $newRepo --json nameWithOwner,description,url
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify renamed repository.' }
          Write-Host $actual
          Write-Host 'RIFTGPU_REBRAND=PASS'
