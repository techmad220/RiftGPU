name: Temporary Format RiftGPU PR9

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  format-pr9:
    if: github.event.issue.title == 'run:format-riftgpu-pr9-20260828'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hip-shared-gemm-v0.2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply rustfmt and push only formatter output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo 'RIFTGPU_FORMAT=NO_CHANGES'
            exit 0
          fi
          git config user.name 'techmad220'
          git config user.email '143960678+techmad220@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt to shared GEMM hardware layer'
          git push origin HEAD:feature/hip-shared-gemm-v0.2
          echo 'RIFTGPU_FORMAT=PASS'
