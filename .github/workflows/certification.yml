name: Full Certification Software Gate

on:
  push:
    branches:
      - certification/v0.1.0-e2e
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Certification / Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test all targets
        run: cargo test --workspace --all-targets
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release build
        run: cargo build --workspace --release
      - name: Dynamic backend plugin E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_TEST_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_test_plugin.dll'
          $env:VRB_REQUIRE_PLUGIN_E2E = '1'
          cargo test --release -p vrb-backends --test plugin_e2e -- --nocapture --test-threads=1
      - name: Dynamic operator plugin E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_TEST_OPERATOR_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_test_operator_plugin.dll'
          $env:VRB_REQUIRE_OPERATOR_E2E = '1'
          cargo test --release -p vrb-operator-loader --test plugin_e2e -- --nocapture --test-threads=1
      - name: Reference GEMM plugin E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_REFERENCE_GEMM_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_gemm_reference_plugin.dll'
          $env:VRB_REQUIRE_REFERENCE_GEMM_E2E = '1'
          cargo test --release -p vrb-gemm-reference-plugin --test plugin_e2e -- --nocapture --test-threads=1
      - name: Dynamic shared operator contract E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_TEST_SHARED_OPERATOR_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_test_shared_operator_plugin.dll'
          $env:VRB_REQUIRE_SHARED_OPERATOR_E2E = '1'
          cargo test --release -p vrb-shared-operator-loader --test plugin_e2e -- --nocapture --test-threads=1
      - name: HIP shared GEMM plugin load E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_HIP_SHARED_GEMM_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_hip_shared_gemm_plugin.dll'
          $env:VRB_REQUIRE_HIP_SHARED_GEMM_LOAD_E2E = '1'
          cargo test --release -p vrb-hip-shared-gemm-plugin --test plugin_load_e2e -- --nocapture --test-threads=1

  licenses:
    name: Certification / License and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: License and source policy
        run: cargo deny check licenses sources bans advisories
