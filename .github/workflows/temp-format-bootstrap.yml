name: TEMP Format Bootstrap

on:
  push:
    branches: [bootstrap/v0.1.0]
    paths:
      - '.github/workflows/temp-format-bootstrap.yml'
      - 'crates/**/*.rs'
      - 'rustfmt.toml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/v0.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.82.0'
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit canonical formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'FORMAT_ALREADY_CLEAN=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'style: apply canonical rustfmt'
          git push origin HEAD:bootstrap/v0.1.0
          echo 'FORMAT_APPLIED=PASS'
