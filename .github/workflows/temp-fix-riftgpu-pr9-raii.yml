name: Temporary Fix RiftGPU PR9 RAII

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix-raii:
    if: github.event.issue.title == 'run:fix-riftgpu-pr9-raii-20260828'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hip-shared-gemm-v0.2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Rename retained RAII guard, verify Windows Clippy, and push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'crates/vrb-hip-shared-gemm-plugin/src/lib.rs'
          $text = Get-Content -LiteralPath $path -Raw
          $oldCtor = "            external: external_guard,"
          $newCtor = "            _external: external_guard,"
          $oldField = "    external: ExternalMemoryGuard<'a>,"
          $newField = "    _external: ExternalMemoryGuard<'a>,"
          if (-not $text.Contains($oldCtor)) { throw 'ImportedRegion constructor marker missing' }
          if (-not $text.Contains($oldField)) { throw 'ImportedRegion field marker missing' }
          $text = $text.Replace($oldCtor, $newCtor).Replace($oldField, $newField)
          Set-Content -LiteralPath $path -Value $text -NoNewline
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Windows Clippy failed after RAII guard rename' }
          git config user.name 'techmad220'
          git config user.email '143960678+techmad220@users.noreply.github.com'
          git add $path
          git commit -m 'fix: mark retained HIP external-memory guard as intentional'
          git push origin HEAD:feature/hip-shared-gemm-v0.2
          Write-Host 'RIFTGPU_RAII_FIX=PASS'
