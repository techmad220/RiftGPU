name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  rust:
    name: CI / Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
          echo "EXACT_HEAD_SHA=$actual"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Linux release tests
        run: cargo test --workspace --all-targets --release
      - name: Linux release build
        run: cargo build --workspace --release
      - name: Windows compile check
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc

  licenses:
    name: CI / License and dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
          echo "EXACT_HEAD_SHA=$actual"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: License and source policy
        run: cargo deny check licenses sources bans advisories
