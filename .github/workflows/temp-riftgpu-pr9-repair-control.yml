name: RiftGPU PR9 Repair Control

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'control/riftgpu-pr9-repair-v2'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hip-shared-gemm-v0.2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Apply exact diagnostics and require clean Windows Clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $hipPath = 'crates/vrb-hip-shared-gemm-plugin/src/lib.rs'
          $hip = Get-Content -LiteralPath $hipPath -Raw
          $oldCtor = "            external: external_guard,"
          $newCtor = "            _external: external_guard,"
          $oldField = "    external: ExternalMemoryGuard<'a>,"
          $newField = "    _external: ExternalMemoryGuard<'a>,"
          if (-not $hip.Contains($oldCtor)) { throw 'ImportedRegion constructor marker missing' }
          if (-not $hip.Contains($oldField)) { throw 'ImportedRegion field marker missing' }
          $hip = $hip.Replace($oldCtor, $newCtor).Replace($oldField, $newField)
          Set-Content -LiteralPath $hipPath -Value $hip -NoNewline

          $vkPath = 'crates/vrb-vulkan-shared-buffer/src/lib.rs'
          $vk = Get-Content -LiteralPath $vkPath -Raw
          $oldMatch = @'
        let value = match operation_result {
            Ok(value) => value,
            Err(error) => return Err(error),
        };
'@
          $newMatch = @'
        let value = operation_result?;
'@
          if (-not $vk.Contains($oldMatch)) { throw 'operation_result match marker missing' }
          $vk = $vk.Replace($oldMatch, $newMatch)
          Set-Content -LiteralPath $vkPath -Value $vk -NoNewline

          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'rustfmt failed' }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Windows Clippy failed' }

          git config user.name 'techmad220'
          git config user.email '143960678+techmad220@users.noreply.github.com'
          git add $hipPath $vkPath
          git commit -m 'fix: satisfy Windows Clippy in shared GEMM path'
          git push origin HEAD:feature/hip-shared-gemm-v0.2
          Write-Host 'RIFTGPU_PR9_REPAIR=PASS'
