name: TEMP PR31 Exact-Head Finalizer

on:
  push:
    branches: [certification/v0.1.0-e2e]
    paths:
      - '.github/workflows/temp-pr31-exact-head-finalizer-20260829.yml'

permissions:
  contents: read
  statuses: read

env:
  EXACT_SHA: 71b2dd6966e47162b23d57440c21bca95ecd970f

jobs:
  rust:
    name: PR31 Exact / Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
          echo "EXACT_HEAD_SHA=$actual"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test all targets
        run: cargo test --workspace --all-targets
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Release tests
        run: cargo test --workspace --all-targets --release
      - name: Release build
        run: cargo build --workspace --release
      - name: Dynamic backend plugin E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_TEST_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_test_plugin.dll'
          $env:VRB_REQUIRE_PLUGIN_E2E = '1'
          cargo test --release -p vrb-backends --test plugin_e2e -- --nocapture --test-threads=1
      - name: Dynamic operator plugin E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_TEST_OPERATOR_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_test_operator_plugin.dll'
          $env:VRB_REQUIRE_OPERATOR_E2E = '1'
          cargo test --release -p vrb-operator-loader --test plugin_e2e -- --nocapture --test-threads=1
      - name: Reference GEMM plugin E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_REFERENCE_GEMM_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_gemm_reference_plugin.dll'
          $env:VRB_REQUIRE_REFERENCE_GEMM_E2E = '1'
          cargo test --release -p vrb-gemm-reference-plugin --test plugin_e2e -- --nocapture --test-threads=1
      - name: Dynamic shared operator contract E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_TEST_SHARED_OPERATOR_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_test_shared_operator_plugin.dll'
          $env:VRB_REQUIRE_SHARED_OPERATOR_E2E = '1'
          cargo test --release -p vrb-shared-operator-loader --test plugin_e2e -- --nocapture --test-threads=1
      - name: HIP shared GEMM plugin load E2E (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VRB_HIP_SHARED_GEMM_PLUGIN_PATH = Join-Path $PWD 'target\release\vrb_hip_shared_gemm_plugin.dll'
          $env:VRB_REQUIRE_HIP_SHARED_GEMM_LOAD_E2E = '1'
          cargo test --release -p vrb-hip-shared-gemm-plugin --test plugin_load_e2e -- --nocapture --test-threads=1
      - name: Require trusted exact-head AMD hardware proof (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STATUS_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $Context = 'TECH / AMD exact-head hardware'
          $TrustedLogin = 'techmad220'
          $TrustedUserId = [Int64]143960678
          $Sha = $env:EXACT_SHA
          $Headers = @{
            Authorization = "Bearer $env:STATUS_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $Uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/${Sha}?per_page=100"
          $Deadline = [DateTime]::UtcNow.AddMinutes(10)
          do {
            $RawStatuses = Invoke-RestMethod -Method Get -Uri $Uri -Headers $Headers -TimeoutSec 20
            $Statuses = @($RawStatuses | Write-Output)
            $Hit = @($Statuses | Where-Object { [string]$_.context -eq $Context } | Select-Object -First 1)
            if ($Hit.Count -gt 0) {
              $State = [string]$Hit[0].state
              $CreatorLogin = [string]$Hit[0].creator.login
              $CreatorId = [Int64]$Hit[0].creator.id
              $Description = [string]$Hit[0].description
              Write-Host "AMD_HARDWARE_STATUS state=$State creator=$CreatorLogin creator_id=$CreatorId sha=$Sha"
              if ($CreatorLogin -ne $TrustedLogin -or $CreatorId -ne $TrustedUserId) {
                throw "Hardware proof publisher mismatch login=$CreatorLogin id=$CreatorId"
              }
              if ($State -eq 'success') {
                $ExpectedPrefix = "TECH AMD hardware PASS for exact PR head $($Sha.Substring(0,12))"
                if (-not $Description.StartsWith($ExpectedPrefix,[StringComparison]::Ordinal)) {
                  throw "Hardware proof receipt mismatch: $Description"
                }
                Write-Host "AMD_EXACT_HEAD_HARDWARE_PROOF=PASS sha=$Sha"
                exit 0
              }
              if ($State -in @('failure','error')) { throw "Hardware proof reported $State`: $Description" }
            }
            Start-Sleep -Seconds 15
          } while ([DateTime]::UtcNow -lt $Deadline)
          throw "Timed out waiting for trusted AMD exact-head hardware proof for $Sha"

  licenses:
    name: PR31 Exact / License and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: License and source policy
        run: cargo deny check licenses sources bans advisories

  exact-head-proof:
    name: PR31 Exact / Sealed proof
    needs: [rust, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Seal exact revision
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_SHA"
          echo "RIFTGPU_PR31_REPLACEMENT_EXACT_HEAD_CERT=PASS"
          echo "sha=$actual"
