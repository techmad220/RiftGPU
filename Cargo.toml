[workspace]
members = [
    "crates/vrb-plugin-api",
    "crates/vrb-core",
    "crates/vrb-backends",
    "crates/vrb-cli",
    "crates/vrb-test-plugin",
    "crates/vrb-operators",
    "crates/vrb-operator-plugin-api",
    "crates/vrb-operator-loader",
    "crates/vrb-test-operator-plugin",
    "crates/vrb-gemm-protocol",
    "crates/vrb-gemm-reference",
    "crates/vrb-gemm-reference-plugin",
    "crates/vrb-shared-operators",
    "crates/vrb-shared-operator-plugin-api",
    "crates/vrb-shared-operator-loader",
    "crates/vrb-test-shared-operator-plugin",
    "crates/vrb-gemm-shared-protocol",
    "crates/vrb-vulkan-shared-buffer",
    "crates/vrb-hip-shared-gemm-plugin",
    "crates/vrb-residency",
    "crates/vrb-attention-protocol",
    "crates/vrb-attention-reference",
    "crates/vrb-kv-cache",
    "crates/vrb-execution-plan",
    "crates/vrb-autotune",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/techmad220/RiftGPU"
authors = ["techmad220 contributors"]

[workspace.dependencies]
anyhow = "1.0"
ash = { version = "0.38", default-features = false, features = ["loaded", "std"] }
clap = { version = "4.5", features = ["derive"] }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
